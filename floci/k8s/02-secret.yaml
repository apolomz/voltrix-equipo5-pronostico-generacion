# Credenciales de la base de datos. Valor de ejemplo SOLO para el clúster
# emulado en Floci; no reutilizar esta clave en EC2.
apiVersion: v1
kind: Secret
metadata:
  name: pronostico-secret
  namespace: voltrix-equipo5
type: Opaque
stringData:
  PGUSER: "voltrix"
  PGPASSWORD: "floci-solo-local"
  POSTGRES_USER: "voltrix"
  POSTGRES_PASSWORD: "floci-solo-local"
  POSTGRES_DB: "voltrix"
