openapi: 3.0.3
info:
  title: Voltrix Energy · Pronóstico de Generación
  version: 1.0.0
  description: |
    Contrato HTTP del servicio **Pronóstico de Generación** (Equipo 5). Estima la
    generación futura de energía por planta mediante regresión lineal y ejecuta el
    cálculo con descomposición de datos planta por planta.

    **Servicios que consume:** Inventario de Activos (Equipo 1), Telemetría de Plantas
    (Equipo 2) y Reportes de Generación (Equipo 4).

    **Consumidores previstos**

    | Equipo | Servicio | Operaciones que usa |
    |---|---|---|
    | 6 | Mantenimiento Predictivo | `GET /pronosticos/{plantaId}` |

    **Modos de datos**

    - `DEMO_MODE=true`: genera series simuladas deterministas para `PL-001…PL-080`.
      No llama a otros equipos. Es el modo del Avance 1.
    - `DEMO_MODE=false`: valida las plantas con Inventario, obtiene agregados de
      Reportes y, si no hay datos, agrega lecturas de Telemetría. Con
      `DEMO_FALLBACK=true` puede completar plantas sin datos con el generador demo.

    **Convenciones comunes a todos los equipos**

    - Fechas en RFC 3339 **con zona horaria** (`2026-11-19T14:00:00Z`).
    - Identificadores de plantas y activos según Inventario (Equipo 1): `PL-001`,
      `PL-001-PS-07`.
    - Cada consumidor envía `X-Equipo-Consumidor: equipo-<N>`; toda respuesta incluye
      `X-Request-Id`. Ambos se escriben en los logs como evidencia de consumo real.
    - Errores con el esquema común `Error` (`codigo`, `mensaje`, `requestId`, `detalles`).
    - `429` con `Retry-After` ante sobrecarga, `503` si la base de datos o la
      configuración no están disponibles y `502` si una dependencia falla o no hay datos.
    - `GET /health` y `GET /openapi.yaml` existen en todos los servicios.
    - Las operaciones intensivas aceptan `modo` (`secuencial` | `paralelo`) y `workers`,
      y devuelven `MetricasProcesamiento` para comparar ambas versiones.
  contact:
    name: Equipo 5 · Pronóstico de Generación

servers:
  - url: http://{host}:{puerto}
    description: Despliegue del Componente B (EC2) o entorno local. La dirección vigente está en la hoja Coordinacion_Voltrix.
    variables:
      host:
        default: localhost
        description: IP pública o DNS de la instancia EC2.
      puerto:
        default: "8000"
        description: Puerto de la API.

tags:
  - name: Pronósticos
    description: Generación y consulta de proyecciones de generación por planta.
  - name: Operación
    description: Salud, dependencias y publicación del contrato.

paths:
  /pronosticos/{plantaId}:
    get:
      tags: [Pronósticos]
      operationId: consultarPronosticoPorPlanta
      summary: Consultar el último pronóstico generado para una planta
      parameters:
        - $ref: '#/components/parameters/PlantaId'
        - $ref: '#/components/parameters/EquipoConsumidor'
      responses:
        '200':
          description: Pronóstico encontrado para la planta solicitada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronosticoPlanta'
              examples:
                ejemplo:
                  $ref: '#/components/examples/PronosticoEjemplo'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /pronosticos/generar:
    post:
      tags: [Pronósticos]
      operationId: generarPronosticos
      summary: Generar pronósticos de energía para una o varias plantas
      description: |
        Obtiene el histórico de cada planta desde la capa de datos y calcula la
        proyección con regresión lineal. Con `modo=secuencial` se ejecuta la línea
        base; con `modo=paralelo` se reparte el arreglo de plantas entre workers.

        El backend paralelo se elige con `backend` (`auto`, `thread` o `process`).
        Si se omite, se usa la variable de entorno `PARALLEL_BACKEND`. La respuesta
        incluye `MetricasProcesamiento.duracionMs` medida solo sobre el cálculo, no
        sobre la descarga de datos.
      parameters:
        - $ref: '#/components/parameters/EquipoConsumidor'
        - $ref: '#/components/parameters/Modo'
        - $ref: '#/components/parameters/Workers'
        - $ref: '#/components/parameters/Backend'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudGeneracion'
            examples:
              horario:
                summary: Tres plantas, horizonte horario
                value:
                  planta_ids: [PL-001, PL-002, PL-003]
                  horizonte_periodos: 6
                  frecuencia: hora
              diario:
                summary: Una planta, horizonte diario con rango histórico
                value:
                  plantaIds: [PL-001]
                  horizontePeriodos: 7
                  frecuencia: dia
                  desde: '2026-11-01T00:00:00-05:00'
                  hasta: '2026-11-18T23:59:59-05:00'
      responses:
        '200':
          description: Pronósticos generados exitosamente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Modo-Datos:
              $ref: '#/components/headers/X-Modo-Datos'
            X-Backend-Paralelismo:
              $ref: '#/components/headers/X-Backend-Paralelismo'
            X-Workers:
              $ref: '#/components/headers/X-Workers'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoGeneracion'
              examples:
                demo:
                  $ref: '#/components/examples/ResultadoGeneracionEjemplo'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/PlantaNoEncontrada'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '502':
          $ref: '#/components/responses/DependenciaFallida'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /dependencias/estado:
    get:
      tags: [Operación]
      operationId: consultarEstadoDependencias
      summary: Comprobar la conectividad con Inventario, Telemetría y Reportes
      description: |
        Consulta `/health` de cada dependencia configurada. No genera pronósticos ni
        escribe en la base de datos. En modo demo devuelve `no_aplica`.
      parameters:
        - $ref: '#/components/parameters/EquipoConsumidor'
      responses:
        '200':
          description: Estado de las dependencias configuradas.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDependencias'
              examples:
                demo:
                  value:
                    modoDatos: demo
                    fuentes:
                      - equipo: equipo-1
                        servicio: Inventario de Activos
                        url: null
                        estado: no_aplica
                        latenciaMs: null
                        detalle: 'DEMO_MODE=true: no se consultan dependencias.'
        '429':
          $ref: '#/components/responses/Sobrecarga'

  /health:
    get:
      tags: [Operación]
      operationId: consultarSalud
      summary: Comprobar la disponibilidad del servicio y de su base de datos
      description: No exige `X-Equipo-Consumidor`. Debe responder rápido y sin llamar a otros equipos de forma bloqueante.
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: disponible
                baseDatos: ok
                version: 1.0.0
                tiempoActivoSeg: 3600
        '503':
          description: El servicio no puede acceder a su base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: no_disponible
                baseDatos: error
                version: 1.0.0
                tiempoActivoSeg: 3600

  /openapi.yaml:
    get:
      tags: [Operación]
      operationId: obtenerContrato
      summary: Descargar este contrato
      description: URL que se registra en la columna "URL del contrato OpenAPI" de la hoja Coordinacion_Voltrix.
      responses:
        '200':
          description: Contrato en formato YAML.
          content:
            application/yaml:
              schema:
                type: string

components:
  parameters:
    EquipoConsumidor:
      name: X-Equipo-Consumidor
      in: header
      required: false
      description: Equipo que hace la llamada. Se registra en los logs como evidencia de consumo entre células.
      schema:
        type: string
        pattern: '^equipo-[1-7]$'
        example: equipo-6
    Modo:
      name: modo
      in: query
      required: false
      description: Versión del procesamiento a ejecutar (línea base o técnica paralela).
      schema:
        type: string
        enum: [secuencial, paralelo]
        default: paralelo
    Workers:
      name: workers
      in: query
      required: false
      description: Número de hilos o procesos a usar en modo paralelo. Por defecto lo decide el servicio.
      schema:
        type: integer
        minimum: 1
        maximum: 64
    Backend:
      name: backend
      in: query
      required: false
      description: Backend paralelo. `auto` usa `PARALLEL_BACKEND`; los otros fuerzan hilos o procesos.
      schema:
        type: string
        enum: [auto, thread, process]
        default: auto
    PlantaId:
      name: plantaId
      in: path
      required: true
      description: Identificador único de la planta según Inventario de Activos.
      schema:
        $ref: '#/components/schemas/Identificador'
      example: PL-001

  headers:
    X-Request-Id:
      description: Identificador de la petición, presente también en los logs del servicio.
      schema:
        type: string
        format: uuid
    Retry-After:
      description: Segundos que el consumidor debe esperar antes de reintentar.
      schema:
        type: integer
        minimum: 1
        example: 1
    X-Modo-Datos:
      description: Origen del histórico usado en esta ejecución.
      schema:
        type: string
        enum: [demo, dependencias, mixto]
    X-Backend-Paralelismo:
      description: Backend efectivamente usado por el motor de pronóstico.
      schema:
        type: string
        enum: [secuencial, thread, process]
    X-Workers:
      description: Cantidad de workers efectivos.
      schema:
        type: integer
        minimum: 1

  responses:
    SolicitudInvalida:
      description: La solicitud no cumple el contrato o el rango de fechas es inválido.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: La solicitud no cumple el contrato.
            requestId: 0a4e9c1d-3f2b-4e8a-b7c6-5d1e2f3a4b5c
            detalles:
              - campo: desde
                problema: debe ser una fecha RFC 3339 con zona horaria
    NoEncontrado:
      description: El recurso no existe.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: No existe un pronóstico generado para la planta PL-999.
            requestId: 9c2f7e4a-1d3b-4a6c-8e5f-0b7d9a1c3e2f
    PlantaNoEncontrada:
      description: Al menos una planta solicitada no existe en Inventario de Activos.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: PLANTA_NO_ENCONTRADA
            mensaje: 'No existe en Inventario de Activos: PL-999.'
            requestId: 4d8b2a6e-7c1f-4e3a-9b5d-2f6a8c0e1b4d
            detalles:
              - campo: planta_ids
                problema: 'IDs desconocidos: PL-999'
    Sobrecarga:
      description: Capacidad de admisión agotada. Reintentar después de `Retry-After` segundos.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOBRECARGA
            mensaje: El servicio está atendiendo el máximo de peticiones simultáneas.
            requestId: 2e7a4c9b-6d1f-4b8e-a3c5-7f0d2b9e4a1c
    NoDisponible:
      description: Base de datos, configuración o servicio local no disponible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            baseDatos:
              value:
                codigo: NO_DISPONIBLE
                mensaje: No hay conexión con la base de datos.
                requestId: 8f1b3d5a-2c7e-4f9a-b6d0-1e4c7a9b2d5f
            configuracion:
              value:
                codigo: CONFIGURACION_INCOMPLETA
                mensaje: DEMO_MODE=false requiere las URLs de las dependencias.
                requestId: 8f1b3d5a-2c7e-4f9a-b6d0-1e4c7a9b2d5f
                detalles:
                  - campo: INVENTARIO_URL
                    problema: Variable de entorno no configurada.
    DependenciaFallida:
      description: Una API de otro equipo falló o no entregó datos suficientes.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            inventario:
              value:
                codigo: DEPENDENCIA_FALLIDA
                mensaje: Inventario de Activos respondió 503
                requestId: 3c6e9f2a-8b1d-4e7c-a5f0-6d2b9e1c4a7f
                detalles:
                  - campo: equipo-1
                    problema: 'GET /plantas: Inventario de Activos respondió 503'
            sinDatos:
              value:
                codigo: DATOS_NO_DISPONIBLES
                mensaje: Ninguna planta tiene histórico disponible en Reportes ni en Telemetría.
                requestId: 3c6e9f2a-8b1d-4e7c-a5f0-6d2b9e1c4a7f

  examples:
    PronosticoEjemplo:
      summary: Pronóstico horario de PL-001
      value:
        planta_id: PL-001
        metodo: regresion_lineal
        frecuencia: hora
        generado_en: '2026-11-19T14:00:00Z'
        valores:
          - periodo: '2026-11-19T15:00:00Z'
            generacion_kwh: 40.2
          - periodo: '2026-11-19T16:00:00Z'
            generacion_kwh: 41.6
    ResultadoGeneracionEjemplo:
      summary: Resultado con datos demo
      value:
        modo_ejecucion: paralelo
        backend_paralelismo: thread
        origen_datos: demo
        cantidad_plantas: 2
        pronosticos:
          - planta_id: PL-001
            metodo: regresion_lineal
            frecuencia: hora
            generado_en: '2026-11-25T16:00:00Z'
            valores:
              - periodo: '2026-11-25T17:00:00Z'
                generacion_kwh: 41.9612
        metricas:
          modo: paralelo
          workers: 2
          elementos: 2
          duracionMs: 3
        advertencia: Datos simulados por el modo demo; no representan telemetría real.

  schemas:
    Identificador:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      example: PL-001
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, requestId]
      properties:
        codigo:
          type: string
          pattern: '^[A-Z_]+$'
          description: |
            Código estable en MAYÚSCULAS. Comunes: SOLICITUD_INVALIDA, NO_ENCONTRADO,
            DUPLICADO, SOBRECARGA, NO_DISPONIBLE, DEPENDENCIA_FALLIDA, ERROR_INTERNO.
            Propios del Equipo 5: PLANTA_NO_ENCONTRADA, DATOS_NO_DISPONIBLES,
            CONFIGURACION_INCOMPLETA, RANGO_INVALIDO, SERIE_INVALIDA.
          example: NO_ENCONTRADO
        mensaje:
          type: string
        requestId:
          type: string
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleError'
    DetalleError:
      type: object
      additionalProperties: false
      required: [campo, problema]
      properties:
        campo:
          type: string
        problema:
          type: string
    Salud:
      type: object
      additionalProperties: false
      required: [estado, baseDatos]
      properties:
        estado:
          type: string
          enum: [disponible, no_disponible]
        baseDatos:
          type: string
          enum: [ok, error]
        version:
          type: string
        tiempoActivoSeg:
          type: integer
          minimum: 0
    MetricasProcesamiento:
      type: object
      additionalProperties: false
      required: [modo, workers, elementos, duracionMs]
      description: Evidencia de cada ejecución intensiva, útil para comparar ejecución secuencial contra paralela.
      properties:
        modo:
          type: string
          enum: [secuencial, paralelo]
        workers:
          type: integer
          minimum: 1
        elementos:
          type: integer
          minimum: 0
          description: Cantidad de plantas procesadas en el lote.
        duracionMs:
          type: integer
          minimum: 0
          description: Tiempo del cálculo, sin incluir la descarga de datos.
    PuntoPronostico:
      type: object
      additionalProperties: false
      required: [periodo, generacion_kwh]
      properties:
        periodo:
          type: string
          format: date-time
        generacion_kwh:
          type: number
          minimum: 0
    PronosticoPlanta:
      type: object
      additionalProperties: false
      required: [planta_id, metodo, frecuencia, generado_en, valores]
      properties:
        planta_id:
          $ref: '#/components/schemas/Identificador'
        metodo:
          type: string
          example: regresion_lineal
        frecuencia:
          type: string
          enum: [hora, dia]
          default: hora
        generado_en:
          type: string
          format: date-time
        valores:
          type: array
          items:
            $ref: '#/components/schemas/PuntoPronostico'
    SolicitudGeneracion:
      type: object
      additionalProperties: false
      required: [planta_ids]
      description: |
        Acepta `planta_ids`/`horizonte_periodos` (contrato actual) y sus alias
        `plantaIds`/`horizontePeriodos` (plantilla común).
      properties:
        planta_ids:
          type: array
          minItems: 1
          description: Lista no vacía de identificadores de plantas a pronosticar.
          items:
            $ref: '#/components/schemas/Identificador'
          example: [PL-001, PL-002]
        horizonte_periodos:
          type: integer
          minimum: 1
          maximum: 168
          default: 6
        frecuencia:
          type: string
          enum: [hora, dia]
          default: hora
        desde:
          type: string
          format: date-time
          description: Inicio opcional del rango histórico (RFC 3339 con zona horaria). Si se omite, se usan los últimos 30 días.
        hasta:
          type: string
          format: date-time
          description: Fin opcional del rango histórico (RFC 3339 con zona horaria, exclusivo). El rango máximo es de 31 días.
    ResultadoGeneracion:
      type: object
      additionalProperties: false
      required: [modo_ejecucion, backend_paralelismo, origen_datos, cantidad_plantas, pronosticos, metricas]
      properties:
        modo_ejecucion:
          type: string
          enum: [secuencial, paralelo]
        backend_paralelismo:
          type: string
          enum: [secuencial, thread, process]
        origen_datos:
          type: string
          enum: [demo, dependencias, mixto]
        cantidad_plantas:
          type: integer
          minimum: 0
        pronosticos:
          type: array
          items:
            $ref: '#/components/schemas/PronosticoPlanta'
        metricas:
          $ref: '#/components/schemas/MetricasProcesamiento'
        advertencia:
          type: string
          nullable: true
    EstadoFuente:
      type: object
      additionalProperties: false
      required: [equipo, servicio, estado]
      properties:
        equipo:
          type: string
          example: equipo-1
        servicio:
          type: string
          example: Inventario de Activos
        url:
          type: string
          nullable: true
        estado:
          type: string
          enum: [ok, error, no_aplica, no_configurado]
        latenciaMs:
          type: integer
          minimum: 0
          nullable: true
        detalle:
          type: string
          nullable: true
    RespuestaDependencias:
      type: object
      additionalProperties: false
      required: [modoDatos, fuentes]
      properties:
        modoDatos:
          type: string
          enum: [demo, real]
        fuentes:
          type: array
          items:
            $ref: '#/components/schemas/EstadoFuente'
