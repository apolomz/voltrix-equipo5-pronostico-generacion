openapi: 3.0.3
info:
  title: Voltrix Energy · Pronóstico de Generación
  version: 1.0.0
  description: |
    Contrato HTTP del servicio **Pronóstico de Generación** (Equipo 5). Estima la generación
    futura de energía por planta mediante modelos de regresión lineal.

    **Servicios que consume:** Inventario de Activos (Equipo 1), Telemetría de Plantas (Equipo 2), Reportes de Generación (Equipo 4).

    **Consumidores previstos**

    | Equipo | Servicio | Operaciones que usa |
    |---|---|---|
    | 6 | Mantenimiento Predictivo | `GET /pronosticos/{plantaId}` |

    **Convenciones comunes a todos los equipos**

    - Fechas en RFC 3339 **con zona horaria** (`2026-11-19T14:00:00Z`).
    - Identificadores de plantas y activos según Inventario (Equipo 1): `PL-001`, `PL-001-PS-07`.
    - Cada consumidor envía `X-Equipo-Consumidor: equipo-<N>`; toda respuesta incluye `X-Request-Id`.
      Ambos se escriben en los logs como evidencia de consumo real.
    - Errores con el esquema común `Error` (`codigo`, `mensaje`, `requestId`, `detalles`).
    - `429` con `Retry-After` ante sobrecarga, `503` si la base de datos no responde y `502` si un
      servicio de otro equipo del que se depende falla.
    - `GET /health` y `GET /openapi.yaml` existen en todos los servicios.
    - Las operaciones de procesamiento intensivo aceptan `modo` (`secuencial` | `paralelo`) y
      `workers`, y devuelven `MetricasProcesamiento` para comparar ambas versiones.
  contact:
    name: Equipo 5 · Pronóstico de Generación

servers:                                                  # COMÚN
  - url: http://{host}:{puerto}
    description: Despliegue del Componente B (EC2) o entorno local. La dirección vigente está en la hoja Coordinacion_Voltrix.
    variables:
      host:
        default: localhost
        description: IP pública o DNS de la instancia EC2.
      puerto:
        default: "8000"

tags:
  - name: Pronosticos
    description: Consulta de proyecciones de generación energética por planta.
  - name: Procesamiento
    description: Generación de pronósticos por planta a partir de datos operativos e históricos.
  - name: Operación
    description: Salud del servicio y publicación del contrato.

paths:
  /pronosticos/{plantaId}:
    get:
      tags: [Pronosticos]
      operationId: consultarPronosticoPorPlanta
      summary: Consultar el último pronóstico generado para una planta
      parameters:
        - $ref: '#/components/parameters/PlantaId'
        - $ref: '#/components/parameters/EquipoConsumidor'
      responses:
        '200':
          description: Pronóstico encontrado para la planta solicitada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PronosticoPlanta'
              examples:
                ejemplo:
                  $ref: '#/components/examples/PronosticoEjemplo'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /pronosticos/generar:
    post:
      tags: [Procesamiento]
      operationId: generarPronosticos
      summary: Generar pronósticos de energía para una o varias plantas
      description: |
        Obtiene y valida los datos históricos mediante sus dependencias (Inventario de Activos,
        Telemetría de Plantas y Reportes de Generación) y calcula la proyección de generación por
        planta mediante regresión lineal. Acepta `modo` (`secuencial` o `paralelo`) y `workers`
        según la convención común del sistema.
      parameters:
        - $ref: '#/components/parameters/EquipoConsumidor'
        - $ref: '#/components/parameters/Modo'
        - $ref: '#/components/parameters/Workers'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudGeneracion'
            example:
              planta_ids: [PLANTA-001, PLANTA-002]
              horizonte_periodos: 6
              frecuencia: hora
      responses:
        '200':
          description: Pronósticos generados exitosamente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoGeneracion'
              example:
                modo_ejecucion: paralelo
                backend_paralelismo: thread
                origen_datos: dependencias
                cantidad_plantas: 2
                pronosticos:
                  - planta_id: PLANTA-001
                    metodo: regresion_lineal
                    frecuencia: hora
                    generado_en: '2026-11-19T14:00:00Z'
                    valores:
                      - periodo: '2026-11-19T15:00:00Z'
                        generacion_kwh: 40.2
                metricas:
                  modo: paralelo
                  workers: 2
                  elementos: 2
                  duracionMs: 28
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '502':
          $ref: '#/components/responses/DependenciaFallida'
        '503':
          $ref: '#/components/responses/NoDisponible'

  # --------------------------- COMÚN ---------------------------
  /health:
    get:
      tags: [Operación]
      operationId: consultarSalud
      summary: Comprobar la disponibilidad del servicio y de su base de datos
      description: No exige `X-Equipo-Consumidor`. Debe responder rápido y sin llamar a otros equipos de forma bloqueante.
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: disponible
                baseDatos: ok
                version: 1.0.0
                tiempoActivoSeg: 3600
        '503':
          description: El servicio no puede acceder a su base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: no_disponible
                baseDatos: error
                version: 1.0.0
                tiempoActivoSeg: 3600

  /openapi.yaml:
    get:
      tags: [Operación]
      operationId: obtenerContrato
      summary: Descargar este contrato
      description: URL que se registra en la columna "URL del contrato OpenAPI" de la hoja Coordinacion_Voltrix.
      responses:
        '200':
          description: Contrato en formato YAML.
          content:
            application/yaml:
              schema:
                type: string

components:
  parameters:
    # COMÚN
    EquipoConsumidor:
      name: X-Equipo-Consumidor
      in: header
      required: false
      description: Equipo que hace la llamada. Se registra en los logs como evidencia de consumo entre células.
      schema:
        type: string
        pattern: '^equipo-[1-7]$'
        example: equipo-6
    Limit:
      name: limit
      in: query
      required: false
      description: Tamaño de página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Número de elementos a omitir.
      schema:
        type: integer
        minimum: 0
        default: 0
    Modo:
      name: modo
      in: query
      required: false
      description: Versión del procesamiento a ejecutar (línea base o técnica paralela/concurrente).
      schema:
        type: string
        enum: [secuencial, paralelo]
        default: paralelo
    Workers:
      name: workers
      in: query
      required: false
      description: Número de hilos, goroutines, procesos o workers a usar en modo paralelo. Por defecto lo decide el servicio.
      schema:
        type: integer
        minimum: 1
        maximum: 64
    PlantaId:
      name: plantaId
      in: path
      required: true
      description: Identificador único de la planta según Inventario de Activos.
      schema:
        $ref: '#/components/schemas/Identificador'
      example: PLANTA-001

  headers:
    # COMÚN
    X-Request-Id:
      description: Identificador de la petición, presente también en los logs del servicio.
      schema:
        type: string
        format: uuid
    Retry-After:
      description: Segundos que el consumidor debe esperar antes de reintentar.
      schema:
        type: integer
        minimum: 1
        example: 1

  responses:
    # COMÚN
    SolicitudInvalida:
      description: La solicitud no cumple el contrato.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: La solicitud no cumple el contrato.
            requestId: 0a4e9c1d-3f2b-4e8a-b7c6-5d1e2f3a4b5c
            detalles:
              - campo: planta_ids
                problema: debe contener al menos un identificador de planta
    NoEncontrado:
      description: El recurso no existe.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: No existe pronóstico generado para la planta PLANTA-999.
            requestId: 9c2f7e4a-1d3b-4a6c-8e5f-0b7d9a1c3e2f
    Conflicto:
      description: Ya existe un recurso con ese identificador o el estado actual impide la operación.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DUPLICADO
            mensaje: Ya existe un pronóstico activo para PLANTA-001 en ese periodo.
            requestId: 4d8b2a6e-7c1f-4e3a-9b5d-2f6a8c0e1b4d
    Sobrecarga:
      description: Capacidad de admisión agotada. Reintentar después de `Retry-After` segundos.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOBRECARGA
            mensaje: El servicio está atendiendo el máximo de peticiones simultáneas.
            requestId: 2e7a4c9b-6d1f-4b8e-a3c5-7f0d2b9e4a1c
    NoDisponible:
      description: Base de datos o servicio no disponible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_DISPONIBLE
            mensaje: No hay conexión con la base de datos.
            requestId: 8f1b3d5a-2c7e-4f9a-b6d0-1e4c7a9b2d5f
    DependenciaFallida:
      description: Un servicio de otro equipo del que se depende no respondió o respondió con error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DEPENDENCIA_FALLIDA
            mensaje: Telemetría de Plantas respondió 503.
            requestId: 3c6e9f2a-8b1d-4e7c-a5f0-6d2b9e1c4a7f
            detalles:
              - campo: equipo-2
                problema: GET /telemetria/PLANTA-001 respondió 503

  examples:
    PronosticoEjemplo:
      summary: Pronóstico horario de planta PLANTA-001
      value:
        planta_id: PLANTA-001
        metodo: regresion_lineal
        frecuencia: hora
        generado_en: '2026-11-19T14:00:00Z'
        valores:
          - periodo: '2026-11-19T15:00:00Z'
            generacion_kwh: 40.2
          - periodo: '2026-11-19T16:00:00Z'
            generacion_kwh: 41.6

  schemas:
    # ------------------------------- COMÚN -------------------------------
    Identificador:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      example: PLANTA-001
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, requestId]
      properties:
        codigo:
          type: string
          pattern: '^[A-Z_]+$'
          description: |
            Código estable en MAYÚSCULAS. Comunes: SOLICITUD_INVALIDA, NO_ENCONTRADO, DUPLICADO,
            SOBRECARGA, NO_DISPONIBLE, DEPENDENCIA_FALLIDA, ERROR_INTERNO.
          example: NO_ENCONTRADO
        mensaje:
          type: string
        requestId:
          type: string
        detalles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [campo, problema]
            properties:
              campo:
                type: string
              problema:
                type: string
    Salud:
      type: object
      additionalProperties: false
      required: [estado, baseDatos]
      properties:
        estado:
          type: string
          enum: [disponible, no_disponible]
        baseDatos:
          type: string
          enum: [ok, error]
        version:
          type: string
        tiempoActivoSeg:
          type: integer
          minimum: 0
    MetricasProcesamiento:
      type: object
      additionalProperties: false
      required: [modo, workers, elementos, duracionMs]
      description: Evidencia de cada ejecución intensiva, útil para comparar ejecución secuencial contra paralela.
      properties:
        modo:
          type: string
          enum: [secuencial, paralelo]
        workers:
          type: integer
          minimum: 1
        elementos:
          type: integer
          minimum: 0
          description: Cantidad de plantas procesadas en el lote.
        duracionMs:
          type: integer
          minimum: 0

    # ------------------------- Pronóstico de Generación -------------------------
    ValorProyeccion:
      type: object
      additionalProperties: false
      required: [periodo, generacion_kwh]
      properties:
        periodo:
          type: string
          format: date-time
        generacion_kwh:
          type: number
    PronosticoPlanta:
      type: object
      additionalProperties: false
      required: [planta_id, metodo, frecuencia, generado_en, valores]
      properties:
        planta_id:
          $ref: '#/components/schemas/Identificador'
        metodo:
          type: string
          example: regresion_lineal
        frecuencia:
          type: string
          enum: [hora, dia]
          default: hora
        generado_en:
          type: string
          format: date-time
        valores:
          type: array
          items:
            $ref: '#/components/schemas/ValorProyeccion'
    SolicitudGeneracion:
      type: object
      additionalProperties: false
      required: [planta_ids]
      properties:
        planta_ids:
          type: array
          minItems: 1
          description: Lista no vacía de identificadores de plantas a pronosticar.
          items:
            $ref: '#/components/schemas/Identificador'
        horizonte_periodos:
          type: integer
          minimum: 1
          maximum: 168
          default: 6
        frecuencia:
          type: string
          enum: [hora, dia]
          default: hora
        desde:
          type: string
          format: date-time
        hasta:
          type: string
          format: date-time
    ResultadoGeneracion:
      type: object
      additionalProperties: false
      required: [modo_ejecucion, backend_paralelismo, cantidad_plantas, pronosticos, metricas]
      properties:
        modo_ejecucion:
          type: string
          enum: [secuencial, paralelo]
        backend_paralelismo:
          type: string
          enum: [thread, process, secuencial]
        origen_datos:
          type: string
          example: dependencias
        cantidad_plantas:
          type: integer
          minimum: 0
        pronosticos:
          type: array
          items:
            $ref: '#/components/schemas/PronosticoPlanta'
        metricas:
          $ref: '#/components/schemas/MetricasProcesamiento'
        advertencia:
          type: string