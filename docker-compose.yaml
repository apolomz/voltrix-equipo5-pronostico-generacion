services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltrix-equipo5-api
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "true"
      MAX_WORKERS: "2"
      PARALLEL_BACKEND: "thread"
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
